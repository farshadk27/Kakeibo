<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Kakeibo Revision Recovery</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
body{background:#080b12;color:#fff;font-family:tahoma;padding:25px}
button{padding:12px 18px;border:0;border-radius:12px;background:#287cff;color:#fff;font-weight:bold;margin:5px}
.card{background:#151b2b;padding:18px;border-radius:15px;margin:12px 0}
.good{color:#20df91}.bad{color:#ff6070}
</style>
</head>
<body>
<h2>Kakeibo Revision Recovery</h2>
<p>تاریخچه نسخه‌های قبلی فایل kakeibo_store.json را بررسی می‌کند.</p>
<button onclick="login()">Login Google</button>
<button onclick="scan()">Scan Revisions</button>
<div id="out"></div>

<script>
const CLIENT_ID="1040294367701-rhoj2ubfs2b46ogo1ckjhv1k0fo080lt.apps.googleusercontent.com";
let token="";
let fileId="";

function login(){
google.accounts.oauth2.initTokenClient({
client_id:CLIENT_ID,
scope:"https://www.googleapis.com/auth/drive.appdata",
callback:r=>{token=r.access_token;alert("Login OK")}
}).requestAccessToken();
}

async function getFile(){
let r=await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='kakeibo_store.json'&fields=files(id,name)",{
headers:{Authorization:"Bearer "+token}
});
let j=await r.json();
fileId=j.files?.[0]?.id;
}

async function readRevision(id){
let r=await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}/revisions/${id}?alt=media`,{
headers:{Authorization:"Bearer "+token}
});
return await r.text();
}

function analyze(t){
try{
let j=JSON.parse(t);
let count=0, income="";
if(j.months){
Object.values(j.months).forEach(m=>{
 if(m.transactions) count+=m.transactions.length;
 if(m.budget?.income) income=m.budget.income;
});
}
return {count,income};
}catch{return {count:"?",income:"?"}}
}

async function scan(){
if(!token)return alert("Login کن");
document.getElementById("out").innerHTML="در حال بررسی...";
await getFile();
if(!fileId)return out.innerHTML="فایل پیدا نشد";

let r=await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}/revisions?fields=revisions(id,modifiedTime,size)`,{
headers:{Authorization:"Bearer "+token}
});
let data=await r.json();

let html="";
for(let rev of (data.revisions||[])){
let txt=await readRevision(rev.id);
let a=analyze(txt);
html+=`
<div class="card">
<b>Revision: ${rev.id}</b><br>
تاریخ تغییر: ${new Date(rev.modifiedTime).toLocaleString("fa-IR")}<br>
حجم: ${rev.size||"-"}<br>
تراکنش: <span class="good">${a.count}</span><br>
درآمد: ${a.income||"-"}
</div>`;
}
out.innerHTML=html||"Revision پیدا نشد";
}
</script>
</body>
</html>
