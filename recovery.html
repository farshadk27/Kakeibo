<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Kakeibo Drive Recovery</title>
<style>
body{font-family:tahoma;background:#111;color:#eee;padding:30px}
button{padding:12px 20px;border-radius:10px;border:0;margin:5px;cursor:pointer}
.item{background:#222;padding:15px;margin:10px 0;border-radius:12px}
</style>
</head>
<body>
<h2>Kakeibo Drive Recovery</h2>
<p>این فایل را داخل همان GitHub Pages اپ اجرا کن.</p>

<button onclick="login()">Login Google</button>
<button onclick="scan()">Scan Drive</button>

<div id="result"></div>

<script src="https://accounts.google.com/gsi/client"></script>
<script>
let token = "";

const CLIENT_ID = "1040294367701-rhoj2ubfs2b46ogo1ckjhv1k0fo080lt.apps.googleusercontent.com";

function login(){
 const client = google.accounts.oauth2.initTokenClient({
  client_id: CLIENT_ID,
  scope:"https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.email",
  callback:(r)=>{
    token=r.access_token;
    alert("Login OK");
  }
 });
 client.requestAccessToken();
}

async function scan(){
 if(!token){alert("اول Login کن");return;}

 const res=await fetch(
 'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name,size,modifiedTime)',
 {headers:{Authorization:"Bearer "+token}}
 );

 const data=await res.json();
 let out="<h3>Files</h3>";

 if(!data.files || !data.files.length){
   out+="هیچ فایلی پیدا نشد";
 } else {
 data.files.sort((a,b)=>new Date(b.modifiedTime)-new Date(a.modifiedTime));

 for(const f of data.files){
   let detail="";
   try{
    const r=await fetch(
     `https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`,
     {headers:{Authorization:"Bearer "+token}}
    );
    const json=await r.json();
    let tx=0, latest="";

    if(json.months){
      Object.values(json.months).forEach(y=>{
        Object.values(y).forEach(m=>{
          if(m.transactions){
            tx+=m.transactions.length;
            m.transactions.forEach(t=>{
              if(t.date>latest) latest=t.date;
            });
          }
        });
      });
    }

    detail=`<br>تعداد تراکنش: ${tx}<br>آخرین تاریخ دیتا: ${latest}`;
   }catch(e){}

   out+=`
   <div class="item">
   <b>${f.name}</b><br>
   ID: ${f.id}<br>
   تغییر: ${new Date(f.modifiedTime).toLocaleString('fa-IR')}<br>
   حجم: ${f.size||0}
   ${detail}
   </div>`;
 }
 }

 document.getElementById("result").innerHTML=out;
}
</script>
</body>
</html>
