<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Kakeibo Full Drive Scanner</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
body{background:#080b12;color:#fff;font-family:tahoma;padding:25px}
button{padding:12px 18px;border-radius:12px;border:0;background:#287cff;color:#fff;font-weight:bold;margin:5px}
.card{background:#151b2b;padding:18px;border-radius:15px;margin:12px 0}
.good{color:#20df91}
.small{color:#aaa;font-size:13px}
pre{background:#05070b;padding:12px;overflow:auto;direction:ltr;text-align:left}
</style>
</head>
<body>
<h2>Kakeibo Full Drive Scanner</h2>
<p>تمام فایل‌های AppData درایو را بررسی می‌کند و دنبال نسخه‌های قدیمی‌تر می‌گردد.</p>
<button onclick="login()">Login Google</button>
<button onclick="scan()">Full Scan</button>
<div id="out"></div>

<script>
const CLIENT_ID="1040294367701-rhoj2ubfs2b46ogo1ckjhv1k0fo080lt.apps.googleusercontent.com";
let token="";

function login(){
 google.accounts.oauth2.initTokenClient({
 client_id:CLIENT_ID,
 scope:"https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.email",
 callback:r=>{token=r.access_token;alert("Login OK")}
 }).requestAccessToken();
}

function findData(o,res){
 if(!o||typeof o!=="object") return;
 if(Array.isArray(o)){o.forEach(x=>findData(x,res));return;}
 if(o.amount && o.date) {
   res.count++;
   if(String(o.date)>res.latest) res.latest=o.date;
 }
 Object.values(o).forEach(x=>findData(x,res));
}

async function read(id){
 let r=await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,
 {headers:{Authorization:"Bearer "+token}});
 let t=await r.text();
 try{return JSON.parse(t)}catch{return {}}
}

async function scan(){
 if(!token)return alert("Login کن");
 out.innerHTML="در حال اسکن...";
 let r=await fetch(
 "https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&pageSize=1000&fields=files(id,name,size,modifiedTime,createdTime)",
 {headers:{Authorization:"Bearer "+token}});
 let d=await r.json();

 let html="";
 for(let f of (d.files||[])){
   let json=await read(f.id);
   let res={count:0,latest:""};
   findData(json,res);

   let income="";
   if(json.months){
    Object.values(json.months).forEach(m=>{
      if(m.budget && m.budget.income) income=m.budget.income;
    })
   }

   html+=`
   <div class="card">
   <b>${f.name}</b><br>
   تغییر: ${new Date(f.modifiedTime).toLocaleString("fa-IR")}<br>
   حجم: ${f.size||0}<br>
   تراکنش: <span class="good">${res.count}</span><br>
   آخرین تاریخ دیتا: ${res.latest||"-"}<br>
   درآمد پیدا شده: ${income||"-"}<br>
   ID: ${f.id}
   </div>`;
 }
 out.innerHTML=html||"فایلی پیدا نشد";
}
</script>
</body>
</html>
